services:
  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finplan}
      POSTGRES_USER: ${POSTGRES_USER:-finplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finplan}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:4200
      DATABASE_URL: "postgresql://${POSTGRES_USER:-finplan}:${POSTGRES_PASSWORD:-finplan}@db:5432/${POSTGRES_DB:-finplan}?schema=public"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app:z
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NG_CLI_ANALYTICS: "false"
    depends_on:
      - backend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
